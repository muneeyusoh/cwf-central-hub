<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบขึ้นทะเบียนเครือข่ายสวัสดิการ (MOU)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { background-color: #F8FAFC; font-family: 'Prompt', sans-serif; color: #1E293B; }
    
    .header { background: linear-gradient(135deg, #0F172A, #10B981); color: white; padding: 40px 20px 80px; text-align: center; border-radius: 0 0 24px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .admin-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 600px; margin: -50px auto 30px; position: relative; }
    
    .form-control { border-radius: 12px; padding: 14px 16px; background-color: #F1F5F9; border: 1px solid #CBD5E1; font-weight: 500; }
    .form-control:focus { background-color: #FFFFFF; border-color: #10B981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
    
    .btn-create { background-color: #10B981; color: white; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; border: none; width: 100%; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-create:active { transform: scale(0.98); }
    
    .btn-add-center { border: 2px dashed #10B981; color: #10B981; background: transparent; border-radius: 12px; padding: 10px; width: 100%; font-weight: 600; transition: 0.2s; }
    .btn-add-center:hover, .btn-add-center:active { background: #ecfdf5; }
    
    .center-input-group { animation: slideDown 0.3s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="header">
  <h3 class="fw-bold mb-1"><i class="fa-solid fa-handshake me-2"></i>MOU Registration</h3>
  <p class="text-white-50">เปิดระบบฐานข้อมูลกองทุนสวัสดิการพื้นที่อัตโนมัติ</p>
</div>

<div class="container px-3">
  
  <div class="admin-card">
    <div class="text-center mb-4">
      <h5 class="fw-bold text-dark">ลงทะเบียนเปิดกองทุนใหม่</h5>
      <p class="text-muted small">ระบบจะสร้างฐานข้อมูลแยกส่วน (PDPA) ให้พื้นที่ของคุณทันที</p>
    </div>
    
    <form id="provisionForm" onsubmit="handleProvisioning(event)">
      <div class="mb-3">
        <label class="small text-muted fw-bold mb-1 ms-1">1. ชื่อเทศบาล / กองทุนตำบล</label>
        <input type="text" class="form-control fw-bold text-primary" name="networkName" placeholder="เช่น เทศบาลตำบลแว้ง" required>
      </div>
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-1 ms-1">2. อีเมลประธานกองทุน (Gmail เท่านั้น)</label>
        <input type="email" class="form-control" name="adminEmail" placeholder="เช่น admin@gmail.com (สำหรับรับสิทธิ์ Data Admin)" required>
      </div>
      
      <hr class="my-4 border-light">
      
      <div class="mb-4">
        <label class="small text-muted fw-bold mb-2 ms-1">3. โครงสร้างศูนย์ประสานงานในพื้นที่</label>
        <div class="alert alert-warning border-0 bg-warning bg-opacity-10 text-dark small p-2 rounded-3 mb-3">
          <i class="fa-solid fa-lightbulb text-warning me-1"></i> เพิ่มชื่อศูนย์ให้ครบตามโครงสร้างจริง เพื่อให้ชาวบ้านในพื้นที่เลือกได้ถูกต้องตอนสมัคร
        </div>
        
        <!-- พื้นที่กล่องรับข้อมูลศูนย์ประสานงาน -->
        <div id="centersContainer">
          <div class="input-group mb-2 center-input-group">
            <span class="input-group-text bg-light border-0"><i class="fa-solid fa-location-dot text-muted"></i></span>
            <input type="text" class="form-control center-input" placeholder="ระบุชื่อศูนย์ประสานงานที่ 1" required>
          </div>
        </div>
        
        <!-- ปุ่มกดเพิ่มศูนย์แบบ Dynamic -->
        <button type="button" class="btn-add-center mt-2" onclick="addCenterField()">
          <i class="fa-solid fa-plus me-1"></i> เพิ่มศูนย์ประสานงาน
        </button>
      </div>
      
      <button type="submit" class="btn-create" id="btnCreate"><i class="fa-solid fa-wand-magic-sparkles me-2"></i> ยืนยันการทำ MOU และสร้างระบบ</button>
    </form>
  </div>

</div>

<script>
  // ⚠️ 1. ใส่ URL ของ API Web App ระบบกลาง (Master Hub) ตรงนี้
  const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwG-iVeDmIPxFaqy1GRk9j0PtPljQSllQt2bqP7q8U3E2zbPGzojxvDCQuGYXpNmZQW/exec";

  // ฟังก์ชันเพิ่มกล่องกรอกข้อมูลศูนย์ประสานงาน
  function addCenterField() {
    const container = document.getElementById('centersContainer');
    const div = document.createElement('div');
    div.className = 'input-group mb-2 center-input-group';
    
    div.innerHTML = `
      <span class="input-group-text bg-light border-0"><i class="fa-solid fa-location-dot text-muted"></i></span>
      <input type="text" class="form-control center-input" placeholder="ระบุชื่อศูนย์ประสานงาน" required>
      <button class="btn btn-danger px-3 border-0" type="button" onclick="this.parentElement.remove()" title="ลบศูนย์นี้">
        <i class="fa-solid fa-trash"></i>
      </button>
    `;
    container.appendChild(div);
  }

  // ฟังก์ชันรวบรวมข้อมูลและส่งไปสร้างฐานข้อมูล
  async function handleProvisioning(e) {
    e.preventDefault();
    const btn = document.getElementById('btnCreate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>ระบบกำลังสร้างฐานข้อมูล (ใช้เวลา 5-10 วินาที)...';
    
    // 1. ดึงข้อมูลฟอร์มพื้นฐาน
    const payload = Object.fromEntries(new FormData(e.target).entries());
    payload.action = "provisionNetwork"; 
    
    // 2. กวาดข้อมูลจากกล่อง "ศูนย์ประสานงาน" ทุกกล่องมารวมกัน
    const centerInputs = document.querySelectorAll('.center-input');
    const centersArray = Array.from(centerInputs)
                              .map(input => input.value.trim()) // ตัดช่องว่าง
                              .filter(val => val !== ""); // กรองช่องว่างๆ ทิ้ง
    
    // แปลง Array ให้กลายเป็น String ที่คั่นด้วยลูกน้ำ (,) เพื่อส่งให้ Backend
    payload.centersList = centersArray.join(',');
    
    try {
      const res = await fetch(CENTRAL_API_URL, { 
        method: "POST", 
        body: JSON.stringify(payload) 
      }).then(r=>r.json());
      
      if (res.status === 'success') {
        Swal.fire({
          title: 'สร้างระบบสำเร็จ!',
          html: `ระบบเตรียมฐานข้อมูลสำหรับ <b>${payload.networkName}</b> เรียบร้อยแล้ว<br><br><small class="text-muted">ตรวจสอบสิทธิ์ Admin ได้ที่อีเมล ${payload.adminEmail}</small>`,
          icon: 'success',
          confirmButtonColor: '#10B981'
        }).then(() => {
          window.location.reload(); // โหลดหน้าใหม่เผื่อกรอกเพิ่ม
        });
      } else {
        Swal.fire('ข้อผิดพลาด', res.message, 'error');
      }
    } catch (err) {
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบกลางได้', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles me-2"></i> ยืนยันการทำ MOU และสร้างระบบ';
    }
  }
</script>
</body>
</html>
