<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1E3A8A">
  <title>ระบบสวัสดิการส่วนกลาง (Central Hub)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root { 
      --fintech-primary: #1E3A8A; /* เน้นสีระดับชาติ น้ำเงินเข้ม */
      --fintech-accent: #2563EB; 
      --bg-light: #F8FAFC;
    }
    body { background-color: var(--bg-light); font-family: 'Prompt', sans-serif; color: #1E293B; }
    
    .app-header { background: linear-gradient(135deg, var(--fintech-primary), #3B82F6); color: white; padding: 40px 20px 80px; text-align: center; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 15px rgba(30, 58, 138, 0.15); }
    .card-box { background: white; padding: 25px 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); max-width: 500px; margin: -40px auto 30px; border: 1px solid #E5E7EB; position: relative; }
    
    .form-control, .form-select { border-radius: 12px; border: 1px solid #CBD5E1; background-color: #F8FAFC; padding: 14px; font-weight: 500; font-size: 0.95rem; }
    .form-control:focus, .form-select:focus { background-color: #FFFFFF; border-color: var(--fintech-accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    
    .btn-fintech { background-color: var(--fintech-primary); color: white; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 1.05rem; border: none; transition: 0.3s; box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2); }
    .btn-fintech:active { transform: scale(0.98); }
    
    .pdpa-box { background: #EFF6FF; border: 1px dashed #93C5FD; border-radius: 16px; padding: 16px; font-size: 0.85rem; }
    
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: var(--fintech-primary);" role="status"></div>
  <p class="text-dark fw-bold" id="loaderText">กำลังโหลดระบบส่วนกลาง...</p>
</div>

<div class="app-header">
  <h4 class="fw-bold mb-1"><i class="fa-solid fa-landmark me-2"></i>เครือข่ายสวัสดิการแห่งชาติ</h4>
  <p class="text-white-50 small mb-0">ระบบขึ้นทะเบียนและคัดกรองข้อมูลส่วนกลาง</p>
</div>

<div class="container px-3">
  
  <div class="card-box">
    <div class="text-center mb-4">
      <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;"><i class="fa-solid fa-user-shield"></i></div>
      <h5 class="fw-bold text-dark mb-1">สมาร์ทรีจิสเตอร์</h5>
      <p class="text-muted small">เลือกลงทะเบียนเข้าสู่กองทุนที่มี MOU ในพื้นที่ของคุณ</p>
    </div>
    
    <form id="centralRegisterForm" onsubmit="handleCentralRegister(event)">
      <input type="hidden" name="action" value="centralRegister"> 
      <input type="hidden" id="uid" name="uid">
      <input type="hidden" id="regLatitude" name="latitude">
      <input type="hidden" id="regLongitude" name="longitude">

      <div class="row g-2 mb-3">
        <div class="col-4">
          <select class="form-select" name="prefix" required>
            <option value="" disabled selected>คำนำหน้า</option>
            <option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option>
          </select>
        </div>
        <div class="col-8">
          <input type="text" class="form-control" name="fullName" placeholder="ชื่อ-นามสกุล" required>
        </div>
      </div>
      
      <div class="mb-3">
        <input type="tel" class="form-control fw-bold" name="nationalId" placeholder="เลขประจำตัวประชาชน (13 หลัก)" maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 13);" required>
      </div>
      
      <div class="mb-3">
        <input type="tel" class="form-control" name="phone" placeholder="เบอร์โทรศัพท์ (08XXXXXXXX)" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" required>
      </div>
      
      <hr class="my-4 border-light">
      
      <div class="mb-3">
        <label class="small text-muted fw-bold ms-1 mb-1">1. เลือกกองทุนสวัสดิการพื้นที่ (MOU)</label>
        <select class="form-select fw-bold text-primary" id="mouNetworkSelect" name="subdistrict" onchange="fetchLocalCenters()" required>
          <option value="" disabled selected>-- กำลังโหลดพื้นที่ให้บริการ --</option>
        </select>
        <small class="text-danger d-none mt-1" id="noMouAlert" style="font-size: 0.75rem;"><i class="fa-solid fa-circle-exclamation"></i> พื้นที่นี้ยังไม่มีระบบกองทุนสวัสดิการรองรับ</small>
      </div>
      
      <!-- 🌟 เมื่อเลือกเทศบาลแล้ว ค่อยโหลดศูนย์ประสานงานของเทศบาลนั้นขึ้นมาให้เลือกอีกที -->
      <div class="mb-4" id="localCenterBox" style="display: none;">
        <label class="small text-muted fw-bold ms-1 mb-1">2. เลือกศูนย์ประสานงานใกล้บ้านท่าน</label>
        <select class="form-select text-dark" id="localCenterSelect" name="center" required>
          <option value="" disabled selected>-- โปรดเลือกศูนย์ประสานงาน --</option>
        </select>
      </div>

      <div class="pdpa-box mb-4">
        <div class="form-check">
          <input class="form-check-input mt-1" type="checkbox" name="pdpaConsent" id="pdpaCheck" value="true" required>
          <label class="form-check-label text-muted ms-1" for="pdpaCheck" style="line-height: 1.4;">
            <strong class="text-dark">นโยบายความเป็นส่วนตัวกลาง (National PDPA)</strong><br>
            ข้าพเจ้ายินยอมให้ระบบส่วนกลางจัดเก็บข้อมูลและประมวลผลพิกัดภูมิศาสตร์ (GPS) เพื่อส่งต่อไปยังกองทุนสวัสดิการปลายทางที่ข้าพเจ้าเลือก
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-fintech w-100" id="submitRegBtn"><i class="fa-solid fa-paper-plane me-2"></i> สมัครเข้าสู่กองทุน</button>
    </form>
  </div>
</div>

<script>
  // ⚠️ 1. ใส่ LINE LIFF ID ของ "ระบบกลาง" ตรงนี้
  const CENTRAL_LIFF_ID = "2010764982-RTW4PSbB"; 
  
  // ⚠️ 2. ใส่ URL ของ API Web App ระบบกลาง (Master Hub) ตรงนี้
  const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwG-iVeDmIPxFaqy1GRk9j0PtPljQSllQt2bqP7q8U3E2zbPGzojxvDCQuGYXpNmZQW/exec";

  // ฐานข้อมูลสมมติจำลองศูนย์ประสานงานของแต่ละเทศบาล (ในอนาคตสามารถย้ายไปอยู่บนฐานข้อมูลกลางได้)
  const LOCAL_CENTERS_MAP = {
    "เทศบาลตำบลสุคิริน": ["ศูนย์ชุมชนปารีย์", "ศูนย์ชุมชนเกียร์", "ศูนย์ชุมชนราษฎร์สามัคคี", "ศูนย์ชุมชนกลันตัน", "ศูนย์ชุมชนมาโมง", "ศูนย์ชุมชนสุคิริน"],
    "เทศบาลตำบลแว้ง": ["ศูนย์หมู่ 1 แว้ง", "ศูนย์หมู่ 2 แว้ง", "ศูนย์ตลาดแว้ง"]
  };

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      // 1. ขอพิกัด GPS ก่อนเลย
      requestLocation();
      
      // 2. ดึงรายชื่อเทศบาลที่มี MOU จากระบบกลาง
      await loadAvailableNetworks();

      // 3. เริ่มต้น LIFF
      await liff.init({ liffId: CENTRAL_LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        document.getElementById('uid').value = profile.userId;
        document.getElementById('loader').style.display = 'none';
      } else {
        liff.login();
      }
    } catch (err) {
      document.getElementById('loaderText').innerHTML = `<span class="text-danger">ระบบขัดข้อง: ${err.message}</span>`;
    }
  });

  function requestLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById('regLatitude').value = position.coords.latitude;
          document.getElementById('regLongitude').value = position.coords.longitude;
        },
        (error) => { console.warn("GPS Denied"); }
      );
    }
  }

  // 🌟 ฟังก์ชันดึงรายชื่อกองทุน (MOU) แบบ Dynamic จากระบบกลาง
  async function loadAvailableNetworks() {
    try {
      const res = await fetch(CENTRAL_API_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "getAvailableNetworks" }) 
      }).then(r=>r.json());
      
      const select = document.getElementById('mouNetworkSelect');
      
      if(res.status === 'success' && res.data.length > 0) {
        select.innerHTML = '<option value="" disabled selected>-- เลือกเทศบาล/ตำบล --</option>';
        res.data.forEach(networkName => {
          const option = document.createElement('option');
          option.value = networkName;
          option.text = networkName;
          select.appendChild(option);
        });
      } else {
        select.innerHTML = '<option value="" disabled selected>-- ยังไม่มีเครือข่ายเปิดรับ --</option>';
        document.getElementById('noMouAlert').classList.remove('d-none');
        document.getElementById('submitRegBtn').disabled = true;
      }
    } catch (e) {
      console.error("Load Network Error:", e);
    }
  }

  // 🌟 ฟังก์ชันโหลดศูนย์ประสานงาน หลังจากที่ชาวบ้านเลือกเทศบาลแล้ว
  function fetchLocalCenters() {
    const selectedNetwork = document.getElementById('mouNetworkSelect').value;
    const centerSelect = document.getElementById('localCenterSelect');
    
    // ค้นหาใน Map ว่าเทศบาลที่เลือกมีศูนย์อะไรบ้าง
    const centers = LOCAL_CENTERS_MAP[selectedNetwork] || ["ศูนย์ประสานงานกลาง"];
    
    centerSelect.innerHTML = '<option value="" disabled selected>-- โปรดเลือกศูนย์ประสานงาน --</option>';
    centers.forEach(cName => {
      const option = document.createElement('option');
      option.value = cName;
      option.text = cName;
      centerSelect.appendChild(option);
    });
    
    document.getElementById('localCenterBox').style.display = 'block';
  }

  // 🚀 ส่งข้อมูลเข้าระบบกลาง เพื่อให้ระบบกลางยิงต่อไปยังกองทุนปลายทาง
  async function handleCentralRegister(e) {
    e.preventDefault(); 
    const btn = document.getElementById('submitRegBtn'); 
    btn.disabled = true; 
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังประมวลผล...';
    
    const payload = Object.fromEntries(new FormData(e.target).entries()); 
    payload.nationalId = payload.nationalId.replace(/\D/g, ''); 
    payload.phone = payload.phone.replace(/\D/g, '');
    
    if (payload.nationalId.length !== 13) { 
      Swal.fire('แจ้งเตือน', 'เลขประจำตัวประชาชนต้องมี 13 หลัก', 'warning'); 
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> สมัครเข้าสู่กองทุน'; 
      return; 
    }

    try {
      // ⚡ ยิงข้อมูลไปหา "ระบบกลาง (API Gateway)"
      const res = await fetch(CENTRAL_API_URL, { 
        method: "POST", 
        body: JSON.stringify(payload) 
      }).then(r=>r.json());
      
      if (res.status === 'success') {
        Swal.fire({
          title: 'ลงทะเบียนสำเร็จ!',
          text: res.message, // "ส่งข้อมูลไปยังกองทุนสวัสดิการ เทศบาลตำบล... เรียบร้อยแล้ว"
          icon: 'success',
          confirmButtonColor: '#1E3A8A'
        }).then(() => liff.closeWindow()); 
      } else { 
        Swal.fire('ข้อผิดพลาด', res.message, 'error'); 
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> สมัครเข้าสู่กองทุน'; 
      }
    } catch (e) { 
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบกลางได้', 'error'); 
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> สมัครเข้าสู่กองทุน'; 
    }
  }
</script>
</body>
</html>
